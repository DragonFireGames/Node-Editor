<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Standalone Browser</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
    #browser{display:block;width:100%;height:100%;border:0}
  </style>
  <script src="browser/lib/network.js"></script>
  <script>
    // Standalone browser host. The actual browser UI/runtime lives in
    // browser/browser.html; this page owns the Network so the embedded browser
    // can use the same setup as the editor without depending on the editor.
    (function(){
      const primaryProxy = new ProxyNetworkEndpoint('https://proxy.dragonfire7z.workers.dev/', true);
      const fallbackProxy = new ProxyNetworkEndpoint('', true, false);
      const defaultFallback = new NetworkEndpoint();
      const directFallbackRequest = defaultFallback.handleRequest.bind(defaultFallback);
      defaultFallback.handleRequest = async function(request, type) {
        try {
          const url = new URL(request.url);
          if (url.protocol === 'http:' || url.protocol === 'https:') return null;
        } catch (_) {}
        return await directFallbackRequest(request, type);
      };
      defaultFallback.__browserDefaultFallback = true;

      const network = new Network();
      network.appendEndpoint(primaryProxy);
      network.appendEndpoint(fallbackProxy);
      network.appendEndpoint(defaultFallback);
      network.__browserBaseEndpoints = {
        primary: primaryProxy,
        fallback: fallbackProxy,
        defaultFallback
      };

      window.__sharedBrowserNetwork = network;
      window.browserNetwork = network;
    })();
  </script>
</head>
<body>
  <iframe id="browser" src="browser/browser.html"></iframe>
</body>
</html>
