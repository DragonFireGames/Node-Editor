<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Standalone Browser</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}#browser{display:block;width:100%;height:100%;border:0}</style>
  <script src="browser/lib/network.js"></script>
  <script src="browser/external/peer.js"></script>
  <script src="browser/lib/endpoints/peer.js" data-layer="new URLSearchParams(window.location.search).get('peerLayer')"></script>
  <script>
    window.__previewNetworkReady = (async function() {
      const workers = await fetch('workers.json',{cache:'no-store'}).then(async r=>{if(!r.ok)throw new Error('Failed to load workers.json ('+r.status+')');const c=await r.json();if(!c||typeof c!=='object')throw new Error('Invalid workers.json');return c;}).catch(e=>{console.error(e);return {proxy:'',github:''};});
      window.WorkerConfig = workers;
      const query = new URLSearchParams(location.search);
      const peerLayer = query.get('peerLayer') || 'peer';
      const target = query.get('u') || '';

      const primaryProxy = new ProxyNetworkEndpoint(
        String(workers.proxy || ''),
        true
      );

      const fallbackProxy = new ProxyNetworkEndpoint('', true, false);

      const defaultFallback = new NetworkEndpoint();
      const directFallbackRequest = defaultFallback.handleRequest.bind(defaultFallback);

      defaultFallback.handleRequest = async function(request, type) {
        try {
          const url = new URL(request.url);
          } catch (_) {}

        return await directFallbackRequest(request, type);
      };

      defaultFallback.__browserDefaultFallback = true;

      const network = new Network();

      network.appendEndpoint(primaryProxy);
      network.appendEndpoint(fallbackProxy);
      network.appendEndpoint(defaultFallback);

      network.__browserBaseEndpoints = {
        primary: primaryProxy,
        fallback: fallbackProxy,
        defaultFallback
      };

      // Peer is added only to the preview's network.
      const peerEndpoint = new PeerEndpoint();
      network.prependEndpoint(peerEndpoint);

      window.__sharedBrowserNetwork = network;
      window.browserNetwork = network;
    })();
  </script>
</head>
<body><iframe id="browser"></iframe></body>
<script>
  (async function(){
    await window.__previewNetworkReady;
    const query = new URLSearchParams(location.search);
    const peerLayer = query.get('peerLayer') || 'peer';
    const target = query.get('u') || '';

    const childQuery = new URLSearchParams();

    if (target) {
      childQuery.set('start', target);
      childQuery.set('default', target);
    }
    childQuery.set('hideBrowserBar', '1');
    const frame = document.getElementById('browser');
    if (frame) {
      frame.src = 'browser/browser.html' +
        (childQuery.toString() ? '?' + childQuery.toString() : '');
    }
  })();
</script>
</html>
