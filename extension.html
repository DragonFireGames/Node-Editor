<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Node Editor Extension Host</title>
  <style>
    html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;overflow:hidden}
  </style>
</head>
<body>
  <iframe id="editorFrame" src="index.html" title="Node Editor"></iframe>
  <script>
    const frame = document.getElementById('editorFrame');

    frame.addEventListener('load', () => {
      const editor = frame.contentWindow;
      const framedoc = frame.contentDocument;
      const factories = editor.EditorBuiltinFactories = editor.EditorBuiltinFactories || {};
      const icon = '<img src="test-extension.png" alt="Test Extension" style="width:100%;height:100%;object-fit:contain">';

      // Extension-sidebar destination. The extension itself controls this page.
      factories.test = function() {
        return {
          title: 'Test Extension',
          icon,
          render(g) {
            g.viewBody.innerHTML = '';
            const page = framedoc.createElement('div');
            page.className = 'test-extension-page';
            page.style.cssText = 'height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:48px;overflow:auto';
            page.innerHTML = `
              <div style="max-width:760px;text-align:center">
                <img src="test-extension.png" alt="Test Extension" style="display:block;width:220px;height:220px;object-fit:contain;margin:0 auto 28px">
                <h1 style="margin:0 0 14px;font-size:32px">Test Extension</h1>
                <p style="margin:0 0 24px;color:#aaa;font-size:16px;line-height:1.6">This is the extension page opened from the Extensions sidebar. It is owned by the extension.</p>
                <button id="openTestWelcome" type="button" style="padding:10px 18px;border:1px solid #555;border-radius:8px;background:#242424;color:#eee;cursor:pointer;font-size:15px">Open Test Extension Editor</button>
              </div>`;
            g.viewBody.appendChild(page);

            const openButton = page.querySelector('#openTestWelcome');
            openButton?.addEventListener('click', () => {
              editor.EditorApp.openBuiltin('testWelcome');
            });
          }
        };
      };

      // Separate Welcome destination. This is not part of EditorExtensionAPI.
      factories.testWelcome = function() {
        return {
          title: 'Test Extension Editor',
          icon,
          render(g) {
            g.viewBody.innerHTML = '';
            const page = framedoc.createElement('div');
            page.style.cssText = 'height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:48px;overflow:auto';
            page.innerHTML = `
              <div style="max-width:760px;text-align:center">
                <h1 style="margin:0 0 14px;font-size:32px">Test Extension Editor</h1>
                <p style="margin:0;color:#aaa;font-size:16px;line-height:1.6">This is the separate custom editor page registered by the embedding page. It is opened from Welcome.</p>
              </div>`;
            g.viewBody.appendChild(page);
          }
        };
      };

      // Register the extension itself. The API only knows about this extension,
      // its metadata, and how to open its own page.
      editor.EditorExtensionAPI.register({
        id: 'test',
        name: 'Test Extension',
        description: 'A test extension controlled by the embedding page.',
        icon,
        open() {
          editor.EditorApp.openBuiltin('test');
        }
      });

      // The separate Welcome entry is deliberately outside the extension API.
      editor.EditorApp.addWelcomeBuiltin('testWelcome', 'Test Extension Editor');
    });

    // The embedding page can use this global API to add/update extensions.
    window.NodeEditorExtensions = {
      get editor() { return frame.contentWindow; },
      register(extension) {
        return frame.contentWindow?.EditorExtensionAPI?.register(extension);
      },
      unregister(id) {
        return frame.contentWindow?.EditorExtensionAPI?.unregister(id);
      },
      list() {
        return frame.contentWindow?.EditorExtensionAPI?.list?.() || [];
      },
      open(id) {
        return frame.contentWindow?.EditorExtensionAPI?.open?.(id);
      }
    };
  </script>
</body>
</html>
