<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deployment</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#ddd;font:13px system-ui,sans-serif}#status{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#999;background:#000;z-index:10;pointer-events:none}#status.error{color:#f0a0a8;white-space:pre-wrap;text-align:center;padding:24px;box-sizing:border-box}#stage{position:fixed;inset:0;display:none;background:#000}#stage.ready{display:block}#stage iframe{width:100%;height:100%;border:0;display:block;background:#fff}</style>
<script src="browser/external/jszip.js"></script><script src="browser/lib/filesystem.js"></script><script src="browser/lib/network.js"></script><script src="browser/lib/emulator.js"></script><script src="browser/lib/npm.js"></script><script src="browser/lib/endpoints/app.js"></script><script src="browser/lib/endpoints/static.js"></script><script src="browser/external/peer.js"></script><script src="browser/lib/endpoints/peer.js"></script><script src="browser/lib/keepalive.js"></script>
</head><body><div id="stage"></div><div id="status">Loading deployment…</div>
<script>
(async()=>{
  const status=document.getElementById('status'),stage=document.getElementById('stage'),params=new URLSearchParams(location.search);
  const githubURL=params.get('github')||params.get('githubUrl')||'';
  const branchOverride=params.has('branch')?String(params.get('branch')||'').trim():'';
  const commitOverride=params.has('commit')?String(params.get('commit')||'').trim():'';
  const urlOverride=params.has('url')?String(params.get('url')||'').trim():'';
  const legacyPathOverride=params.has('path')?String(params.get('path')||'').trim():'';
  const peerOverride=params.has('usePeerNetwork')?String(params.get('usePeerNetwork')||'').toLowerCase():null;
  const hasManualBranch=params.has('branch');
  const hasManualCommit=params.has('commit');
  const hasManualPeer=params.has('usePeerNetwork');
  const hasManualUrl=params.has('url')||params.has('path');
  function parseGithub(input){let u;try{u=new URL(input)}catch(_){throw new Error('Invalid GitHub URL.')}if(!/^https?:$/i.test(u.protocol)||!/^(www\.)?github\.com$/i.test(u.hostname))throw new Error('Deployment requires a GitHub repository URL.');const p=u.pathname.split('/').filter(Boolean);if(p.length<2)throw new Error('Invalid GitHub repository URL.');return{owner:p[0],repo:p[1].replace(/\.git$/i,'')}}
  function normalizeRoot(v){let s=String(v||'/').trim();if(!s.startsWith('/'))s='/'+s;return s.replace(/\/+$/,'')||'/'}
  function normalizeOrigin(v){let s=String(v||'http://localhost:3000').trim();if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s))s='http://'+s;try{return new URL(s).origin}catch(_){return 'http://localhost:3000'}}
  function normalizeRuntimeURL(value,fallback){const raw=String(value||'').trim();if(!raw)return fallback;try{const u=new URL(raw,fallback);return u.origin+(u.pathname||'/')+(u.search||'')+(u.hash||'')}catch(_){return fallback}}
  function configuredURL(run){const origin=normalizeOrigin(run.domain);let path=String(run.path||'/').trim()||'/';if(!path.startsWith('/'))path='/'+path;return origin+path}
  function readJSON(fs,path){try{return fs?.existsSync(path)?JSON.parse(fs.readFileSync(path,'utf8')||'{}'):{} }catch(_){return {}}}
  function flattenZip(file,name){return JSZip.loadAsync(file).then(async zip=>{const entries=[],tops=new Set();let rootFile=false;zip.forEach((p,e)=>{const c=p.replace(/^\/+|\/+$/g,'');if(!c)return;const parts=c.split('/');if(parts.length===1){if(!e.dir)rootFile=true;return}tops.add(parts[0]);entries.push({c,e})});if(rootFile||tops.size!==1||!entries.length)return file;const root=[...tops][0],expected=String(name||'').toLowerCase(),rl=root.toLowerCase();if(rl!==expected&&rl!==expected+'-main'&&rl!==expected+'-master')return file;const out=new JSZip();for(const x of entries){if(!x.c.startsWith(root+'/'))continue;const t=x.c.slice(root.length+1);if(!t)continue;if(x.e.dir)out.folder(t);else out.file(t,await x.e.async('uint8array'))}const b=await out.generateAsync({type:'blob'});return new File([b],name+'.zip',{type:'application/zip'})})}
  const bootstrap=new Network();const bootstrapNative=new NetworkEndpoint();bootstrapNative.__networkRole='native';bootstrap.appendEndpoint(bootstrapNative);window.setActiveNetwork?.(bootstrap);
  let workers={};
  try {const wr=await bootstrap.request('workers.json',location.href,{cache:'no-store'},'config');if(!wr?.ok)throw new Error('Failed to load workers.json ('+(wr?.status||'no response')+')');workers=await wr.json();} catch(e){console.error(e)}
  window.WorkerConfig=workers||{};
  const net=new Network();const native=new NetworkEndpoint();native.__networkRole='native';net.appendEndpoint(native);
  if(workers?.proxy&&typeof ProxyNetworkEndpoint==='function')net.appendEndpoint(new ProxyNetworkEndpoint(String(workers.proxy),true));
  window.editorNetwork=net;window.__sharedBrowserNetwork=net;window.setActiveNetwork?.(net);
  async function request(url,options={},type='deployment'){const r=await net.request(url,location.origin,options,type);if(!r)throw new Error(`Network request failed for ${url}`);return r}
  async function getRepo(owner,repo){const r=await request(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`,{headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}},'github-api');if(!r.ok)throw new Error(`GitHub repository lookup failed (${r.status}).`);return r.json()}
  async function getRef(owner,repo,branch){const encoded=String(branch||'main').split('/').filter(Boolean).map(encodeURIComponent).join('/');const r=await request(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/ref/heads/${encoded}`,{headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}},'github-api');if(!r.ok)throw new Error(`GitHub branch lookup failed (${r.status}).`);const d=await r.json();if(!d?.object?.sha)throw new Error('GitHub did not return a commit SHA.');return d.object.sha}
  async function loadArchive(owner,repo,ref){const encoded=String(ref||'').split('/').filter(Boolean).map(encodeURIComponent).join('/');const r=await request(`https://codeload.github.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/zip/${encoded}`,{},'github-archive');if(!r.ok)throw new Error(`GitHub archive download failed (${r.status}).`);const b=await r.blob();if(!b.size)throw new Error('GitHub returned an empty project archive.');return b}
  async function loadRepoAt(owner,repo,ref,name){const b=await loadArchive(owner,repo,ref);return FileSystem.create(await flattenZip(new File([b],name+'.zip',{type:'application/zip'}),name),{sync:false})}
  async function main(){
    if(!githubURL)throw new Error('Deployment requires a github query parameter.');
    const repo=parseGithub(githubURL);status.textContent='Resolving deployment configuration…';
    const repoData=await getRepo(repo.owner,repo.repo);let branch=branchOverride||repoData.default_branch||'main';let commit='';let fs=null;let meta={};let loadedCommit='';
    if(!hasManualBranch&&!hasManualCommit&&!hasManualPeer&&!hasManualUrl){
      const defaultHead=await getRef(repo.owner,repo.repo,branch);fs=await loadRepoAt(repo.owner,repo.repo,defaultHead,repo.repo);loadedCommit=defaultHead;meta=readJSON(fs,'.editor/project.json');
      const savedBranch=String(meta?.deployment?.branch||'').trim();if(savedBranch)branch=savedBranch;
      const savedCommit=String(meta?.deployment?.commit||'').trim();if(savedCommit&&savedCommit!=='latest')commit=savedCommit;
    }
    if(hasManualCommit&&commitOverride&&commitOverride!=='latest')commit=commitOverride;
    if(!commit)commit=await getRef(repo.owner,repo.repo,branch);
    if(loadedCommit!==commit){status.textContent='Downloading deployment commit…';fs=await loadRepoAt(repo.owner,repo.repo,commit,repo.repo);loadedCommit=commit;}
    meta=readJSON(fs,'.editor/project.json');
    const run=readJSON(fs,'.editor/config.json');const type=run.serverType==='node'?'node':'static';const savedDeploy=meta?.deployment||{};
    const usePeerNetwork=hasManualPeer?(peerOverride===''||['1','true','yes','on'].includes(peerOverride)):!!savedDeploy.usePeerNetwork;
    const configuredRuntimeURL=configuredURL(run);const runtimeURL=normalizeRuntimeURL(hasManualUrl?(urlOverride||legacyPathOverride):'',configuredRuntimeURL);const parsedRuntime=new URL(runtimeURL);const domain=parsedRuntime.origin;const runtimePath=parsedRuntime.pathname||'/';const root=normalizeRoot(run.rootfolder);
    let runtime,peerElection=null,keepTimer=null;
    if(type==='static'){
      runtime=new StaticEndpoint({domain,path:runtimePath,rootfolder:root,runfile:run.runfile||'/index.html',filesystem:fs});
      net.prependEndpoint(runtime);await runtime.loading;
    }else{
      runtime=new NodeEmulator({domain,rootfolder:root,pathPrefix:runtimePath,filesystem:fs,fileSystemSync:false,network:net,cwd:run.cwd||'/',env:{NODE_ENV:'production',USER:'watermelonkatana_user'}});
      net.prependEndpoint(runtime.endpoint);await runtime.ready;if(run.nodeCommand)await runtime.terminalCommand(run.nodeCommand);if(!await runtime.waitForServer?.(10000,50))throw new Error('Node command finished, but no listening server was created.');
      if(usePeerNetwork){
        const layer=String(meta.peerLayer||'peer').trim()||'peer';window.setPeerLayer?.(layer);const peerEndpoint=new PeerEndpoint();net.prependEndpoint(peerEndpoint);peerElection=await ensurePeerServer(domain,async()=>runtime.endpoint,{peerLayer:layer,interval:5000});
        const syncKeepAlive=()=>{const hosting=!!peerElection?.server&&!peerElection.server.closed;if(hosting){window.keepAlive?.enable?.();window.keepAlive?.start?.();}else window.keepAlive?.disable?.()};
        syncKeepAlive();keepTimer=setInterval(syncKeepAlive,1000);window.addEventListener('beforeunload',()=>{clearInterval(keepTimer);try{window.keepAlive?.disable?.()}catch(_){}try{peerElection?.close?.()}catch(_){}try{window.setActiveNetwork?.(null)}catch(_){}});
      }
    }
    const iframe=document.createElement('iframe');stage.appendChild(iframe);const pageURL=runtimeURL;const page=new PageEmulator(iframe,{network:net,location:{url:pageURL,origin:domain},history:[]});
    const overrideInfo={branch:hasManualBranch?branchOverride:null,commit:hasManualCommit?(commitOverride||'latest'):null,usePeerNetwork:hasManualPeer?usePeerNetwork:null};
    function deploymentURL(target){const resolved=new URL(target,page.location.url);const u=new URL(location.href);u.searchParams.delete('githubUrl');u.searchParams.delete('sha');u.searchParams.set('github',githubURL);u.searchParams.set('branch',overrideInfo.branch!==null?overrideInfo.branch:branch);u.searchParams.set('commit',overrideInfo.commit!==null?overrideInfo.commit:commit);u.searchParams.set('usePeerNetwork',overrideInfo.usePeerNetwork!==null?(overrideInfo.usePeerNetwork?'true':'false'):(usePeerNetwork?'true':'false'));u.searchParams.set('url',resolved.href);return u.href}
    function navigateReal(target,replace=false){const resolved=new URL(target,page.location.url);const href=resolved.origin===domain?deploymentURL(resolved.href):resolved.href;if(replace)location.replace(href);else location.assign(href);return true}
    page.interceptEvent('navigate',url=>navigateReal(url,false));
    page.interceptEvent('open',(url,activateTab)=>{const resolved=new URL(url,page.location.url);const href=resolved.origin===domain?deploymentURL(resolved.href):resolved.href;const w=window.open(href,'_blank','noopener');if(activateTab===false&&w){try{w.opener=null}catch(_){}}return w||true});
    status.textContent='Starting project…';const response=await request(pageURL,{},'deployment');if(!response?.ok)throw new Error(`Project entry page failed to load (${response?.status||'no response'}).`);await page.setDocument(await response.text(),true,pageURL);stage.classList.add('ready');status.remove();
  }
  await main();
})().catch(e=>{console.error(e);const el=document.getElementById('status');if(el){el.textContent=e?.message||String(e);el.className='error'}});
</script></body></html>
